<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - Sports Line</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-arial antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center text-sm text-gray-600 hover:text-black font-semibold transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Kembali ke Beranda
            </a>
        </div>


        <div class="text-center mb-6">
            <a href="index.html" class="text-3xl font-bold text-black inline-block mb-2">🛒 Sports Line</a>
            <h1 class="text-2xl font-bold text-gray-900">Buat Akun Baru</h1>
            <p class="text-sm text-gray-600 mt-1">Bergabunglah dan temukan berbagai produk olahraga berkualitas</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-semibold"></div>


        <div class="bg-white rounded-lg shadow-md p-6 sm:p-8 border border-gray-200">
            <form id="registerForm" class="space-y-4">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="regName" placeholder="Masukkan nama lengkap" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>


                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="regEmail" placeholder="nama@email.com" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>


                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="regPassword" minlength="8" placeholder="Minimal 8 karakter" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Konfirmasi Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </span>
                        <input type="password" id="regConfirmPassword" placeholder="Ulangi kata sandi" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>

         
                <label class="flex items-start gap-2 text-xs text-gray-600 mt-2 cursor-pointer">
                    <input type="checkbox" required class="mt-0.5 rounded text-black focus:ring-black cursor-pointer">
                    <span>Saya setuju dengan <a href="terms.html" class="text-black font-bold underline">Syarat & Ketentuan</a> berlaku.</span>
                </label>

                <button type="submit"
                    class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 rounded transition duration-200 cursor-pointer">
                    Daftar Sekarang
                </button>
            </form>
        </div>


        <p class="text-center text-sm text-gray-600 mt-6">
            Sudah punya akun? 
            <a href="login.html" class="text-black font-bold hover:underline">Masuk di sini</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
