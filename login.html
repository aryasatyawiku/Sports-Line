<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sports Line</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-arial antialiased min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <a href="index.html" class="text-3xl font-bold text-black inline-block mb-2">🛒 Sports Line</a>
            <h1 class="text-2xl font-bold text-gray-900">Selamat Datang Kembali!</h1>
            <p class="text-sm text-gray-600 mt-1">Silakan masuk ke akun Anda untuk melanjutkan belanja</p>
        </div>


        <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-semibold"></div>
        <div class="bg-white rounded-lg shadow-md p-6 sm:p-8 border border-gray-200">
            <form id="loginForm" class="space-y-5">

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="loginEmail" placeholder="nama@email.com" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="loginPassword" placeholder="••••••••" required
                            class="w-full pl-10 pr-4 py-3 rounded border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                        <input type="checkbox" class="rounded text-black focus:ring-black">
                        <span>Ingat saya</span>
                    </label>
                    <a href="reset-password.html" class="text-black font-bold hover:underline">Lupa kata sandi?</a>
                </div>

                <button type="submit"
                    class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 rounded transition duration-200">
                    Masuk Sekarang
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-gray-600 mt-6">
            Belum punya akun? 
            <a href="register.html" class="text-black font-bold hover:underline">Daftar sekarang</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
